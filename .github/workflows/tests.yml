name: tests

on:
  push:
    # dev2 = 작업·실험 브랜치(L-001 개정 2026-09-29). 커밋이 전부 여기 쌓이므로
    # CI 도 여기서 돌아야 한다(FIX-018 — 이전엔 dev 승격 때 처음 돌았다).
    branches: [main, dev, dev2]
  pull_request:

# dev2 는 커밋마다 푸시하므로 같은 브랜치에 연달아 밀면 옛 실행을 취소하고
# 최신 커밋만 끝까지 돌린다(FIX-018).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: relationship
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d relationship"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI 전용 일회성 DB 값(비밀 아님). LLM · 임베딩은 테스트에서 스텁이다.
      # DATABASE_URL 은 서비스 컨테이너의 기본 DB(relationship)를 가리키지만
      # pytest 는 실제로는 거기에 붙지 않는다 -- 아래 참고.
      DATABASE_URL: postgresql+psycopg://app:pass@localhost:5432/relationship
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # alembic upgrade head 를 여기서 개발 DB(relationship)에 직접 돌리던
      # 단계는 뺐다(FIX-006). tests/conftest.py 가 pytest 세션 시작 시
      # DATABASE_URL 의 DB 이름만 relationship_test 로 바꿔 그 DB 를 만들고
      # (CREATE DATABASE) vector 확장 + alembic upgrade head 를 스스로
      # 적용한다 -- 로컬 실행과 CI 가 같은 경로를 타므로 이 단계는
      # 중복이었다.
      # -rs: DB 테스트가 skip되면 사유를 출력한다. skip이 있으면 실패로 본다.
      - run: |
          python -m pytest -q -rs tests/ | tee pytest.out
          if grep -qE '[0-9]+ skipped' pytest.out; then echo "::error::skipped tests found"; exit 1; fi
