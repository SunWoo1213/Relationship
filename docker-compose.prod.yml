# Refs: P9-infra D17 R14 R-U10D-1 R-U10D-4 R-U10D-9 security
#
# 운영 compose — EC2 1대에 caddy(80/443) · backend(FastAPI) · postgres(pgvector) 3개를 올린다.
# 로컬 개발 DB 용 docker-compose.yml 과 별개다(그 파일은 건드리지 않는다).
#
# 비밀 값은 이 파일에 없다. `${NAME}` 보간은 서버의 `.env`(또는 --env-file)에서, 백엔드 앱 설정은
# `env_file` 로 같은 서버 `.env` 에서 온다. 값 없이 기동하면 `:?` 가 거부한다.
#
# 볼륨을 지우는 옵션 금지(security.md §4) — `docker compose down -v` / `volume rm` / `prune` 은 사용자만.
#
# 프로젝트 이름을 고정한다 — 로컬 개발 DB 프로젝트(capstone2)·옛 relationship_pgdata 볼륨과
# 섞이지 않게 하는 유일한 방어다(01-plan 사실 6, F-P9V-3).
name: relationship-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # env_file 을 두지 않는다 — LLM 키 같은 앱 비밀을 DB 컨테이너에 주지 않는다.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (.env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (.env)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required (.env)}
    # 호스트 포트를 노출하지 않는다 — 같은 compose 네트워크의 backend 만 접속한다.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    logging: *default-logging

  backend:
    build:
      context: .
      target: backend
    image: relationship-backend:${GIT_SHA:-local}
    restart: unless-stopped
    # 서버 .env 의 앱 설정(LLM 키·VAPID·스케줄러 스위치 등). 아래 environment 가 같은 이름을 덮어쓴다.
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      # 비밀번호 없는 URL. 비밀번호는 아래 POSTGRES_PASSWORD 로 app/config.py 가 채운다(결정 O) —
      # 특수문자 비밀번호도 안전하고, 비밀번호가 든 URL 꼴을 파일에 두지 않는다.
      DATABASE_URL: postgresql://${POSTGRES_USER}@postgres:5432/${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (.env)}
    # 호스트 포트를 노출하지 않는다 — caddy 만 backend:8000 으로 프록시한다.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      start_period: 60s
    logging: *default-logging

  caddy:
    build:
      context: .
      target: caddy
    image: relationship-caddy:${GIT_SHA:-local}
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required (.env)}
    volumes:
      # 인증서를 보존한다 — 재빌드마다 재발급하면 발급 한도를 소모한다.
      - caddy_data:/data
      - caddy_config:/config
    # 백엔드가 비정상이어도 정적 화면은 뜬다.
    depends_on:
      - backend
    logging: *default-logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
